<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- outer frame -->
  <rect x="1.5" y="1.5" width="21" height="21" rx="2" fill="none" stroke="#1f3a5f" stroke-width="1.3"/>

  <!-- grid lines -->
  <line x1="8.5" y1="1.5" x2="8.5" y2="22.5" stroke="#1f3a5f" stroke-width="0.8"/>
  <line x1="15.5" y1="1.5" x2="15.5" y2="22.5" stroke="#1f3a5f" stroke-width="0.8"/>
  <line x1="1.5" y1="8.5" x2="22.5" y2="8.5" stroke="#1f3a5f" stroke-width="0.8"/>
  <line x1="1.5" y1="15.5" x2="22.5" y2="15.5" stroke="#1f3a5f" stroke-width="0.8"/>

  <!-- highlighted grid square (the "found" cell) -->
  <rect x="8.5" y="8.5" width="7" height="7" fill="#2e8b57" fill-opacity="0.25" stroke="#2e8b57" stroke-width="1"/>

  <!-- crosshair / precise point marker -->
  <line x1="12" y1="9.6" x2="12" y2="14.4" stroke="#c0392b" stroke-width="1"/>
  <line x1="9.6" y1="12" x2="14.4" y2="12" stroke="#c0392b" stroke-width="1"/>
  <circle cx="12" cy="12" r="1.3" fill="#c0392b"/>
</svg>
