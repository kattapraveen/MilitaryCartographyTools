  <circle cx="12" cy="12" r="8.2" fill="#a6be65"/>
  <circle cx="12" cy="12" r="5.4" fill="#b18457"/>
  <circle cx="12" cy="12" r="2.6" fill="#e8d6c9"/>
</svg>
