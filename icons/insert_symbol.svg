  <line x1="18.5" y1="16.3" x2="18.5" y2="20.7" stroke="#1f3a5f" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="16.3" y1="18.5" x2="20.7" y2="18.5" stroke="#1f3a5f" stroke-width="1.3" stroke-linecap="round"/>
</svg>
