  <circle cx="20" cy="5" r="2" fill="#1f3a5f"/>
  <line x1="5.4" y1="17.6" x2="18.6" y2="6.4" stroke="#1f3a5f" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="9" y1="15" x2="12" y2="11" stroke="#1f3a5f" stroke-width="2" stroke-linecap="round"/>
</svg>
