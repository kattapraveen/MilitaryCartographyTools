<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- multi-directional hillshade: a hill silhouette lit from two
       different azimuths at once (short arrows from upper-left and
       upper-right), unlike a single-direction hillshade's one light -->
  <path d="M 3 18 L 9 9 L 13 14 L 16 10 L 21 18 Z" fill="none" stroke="#1f3a5f" stroke-width="1.4" stroke-linejoin="round"/>
  <line x1="4" y1="4" x2="7.5" y2="7.5" stroke="#1f3a5f" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 4.6 7 L 4 4 L 7 4.6" fill="none" stroke="#1f3a5f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="20" y1="4" x2="16.5" y2="7.5" stroke="#1f3a5f" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M 19.4 7 L 20 4 L 17 4.6" fill="none" stroke="#1f3a5f" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
